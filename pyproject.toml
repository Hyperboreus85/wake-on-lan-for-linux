[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wake-on-lan-for-linux"
version = "0.5.0.dev0"
description = "A simple Wake-on-LAN manager for Linux"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "GPL-3.0-or-later"}
authors = [{name = "Wake on LAN for Linux contributors"}]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Environment :: X11 Applications :: GTK",
  "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
]

[project.scripts]
wol-linux = "wol_linux.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.package-data]
wol_linux = ["locale/*/LC_MESSAGES/*.mo"]

[tool.setuptools.data-files]
"share/applications" = ["data/io.github.Hyperboreus85.WakeOnLanForLinux.desktop"]
"share/metainfo" = ["data/io.github.Hyperboreus85.WakeOnLanForLinux.metainfo.xml"]
"share/icons/hicolor" = ["data/icons/hicolor/index.theme"]
"share/icons/hicolor/scalable/apps" = ["data/icons/hicolor/scalable/apps/io.github.Hyperboreus85.WakeOnLanForLinux.svg"]
"share/icons/hicolor/scalable/actions" = ["data/icons/hicolor/scalable/actions/adw-entry-edit-symbolic.svg"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
